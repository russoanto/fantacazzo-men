<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albo d&#39;oro e mercato — Fantacazzo</title>
<meta name="description" content="Albo d'oro della lega, bacheca dei titoli, record e tutti i movimenti di mercato.">
<meta name="theme-color" content="#171412">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,800&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="albo">

<div class="topbar">
  <div><span data-slot="data-oggi"></span></div>
  <div><span data-slot="lega"></span></div>
</div>

<header class="bar">
  <a class="wordmark" href="index.html">FANTACAZZO</a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="giornata.html">Giornata</a>
    <a href="squadre.html">Squadre</a>
    <a href="albo.html" aria-current="page">Albo &amp; mercato</a>
  </nav>
</header>

<main class="page">
  <div class="page-head">
    <h1 data-slot="albo-titolo"></h1>
    <div class="tabs">
      <button class="tab" type="button" data-tab-albo="albo">Albo d&#39;oro</button>
      <button class="tab" type="button" data-tab-albo="mercato">Mercato</button>
    </div>
  </div>

  <section data-sezione="albo" class="split-albo">
    <div class="stack">
      <div class="champion">
        <div>
          <div class="eyebrow" data-slot="champ-anno"></div>
          <div class="nome" data-slot="champ-nome"></div>
          <div class="sub" data-slot="champ-sub"></div>
        </div>
        <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#EFE7D7" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 5H5v2a3 3 0 0 0 3 3"></path><path d="M16 5h3v2a3 3 0 0 1-3 3"></path><path d="M10 14h4l1 6H9z"></path></svg>
      </div>

      <div class="panel">
        <div class="albo-head">
          <span class="col-anno">Stagione</span>
          <span class="col-camp">Campione</span>
          <span class="col-sec">Secondo</span>
          <span class="col-fp">Fantapunti</span>
        </div>
        <div data-slot="albo-rows"></div>
      </div>
    </div>

    <div class="stack">
      <div class="panel strong">
        <header><h2>Bacheca</h2></header>
        <div data-slot="bacheca"></div>
      </div>
      <div class="panel" style="padding:20px;display:flex;flex-direction:column;gap:14px">
        <span class="chips-label">Record della lega</span>
        <div data-slot="record"></div>
      </div>
    </div>
  </section>

  <section data-sezione="mercato" class="split-albo" hidden>
    <div class="stack-sm">
      <div class="chips">
        <span class="chips-label">Tipo</span>
        <button class="chip" type="button" data-filtro-mercato="tutti">Tutti</button>
        <button class="chip" type="button" data-filtro-mercato="scambio">Scambi</button>
        <button class="chip" type="button" data-filtro-mercato="asta">Asta</button>
      </div>
      <div class="panel strong" data-slot="movimenti"></div>
    </div>

    <div class="stack">
      <div class="panel strong">
        <header><h2>Top spese asta</h2></header>
        <div data-slot="spese"></div>
      </div>
      <div class="callout">
        <span class="label">Finestra di mercato</span>
        <span class="big" data-slot="finestra"></span>
        <p>Scambi liberi per due settimane, poi rosa bloccata fino a fine stagione.</p>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div>
    <div class="wordmark">FANTACAZZO</div>
    <div class="small">fantacazzo.men &middot; lega <span data-slot="lega-nome"></span> &middot; stagione <span data-slot="stagione"></span></div>
  </div>
  <nav>
    <div><span class="h">Lega</span><a href="index.html">Home</a><a href="giornata.html">Giornata</a><a href="squadre.html">Squadre</a></div>
  </nav>
</footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
